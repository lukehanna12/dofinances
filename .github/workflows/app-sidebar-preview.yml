name: Preview real app sidebar (test branch only)

on:
  push:
    branches: [test/app-sidebar]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dofinances-app-sidebar-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Build isolated app preview
    if: github.ref == 'refs/heads/test/app-sidebar'
    runs-on: ubuntu-24.04
    environment: cloudflare-production
    steps:
      - name: Checkout test branch
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Audit two entire observed LPH material states and blur transfer
        run: python3 preview/oracle-material-state-audit.py
      - name: Decode complete live binding uniform projections
        run: python3 preview/oracle-runtime-projection-audit.py
      - name: Source-level Oracle LPH and numerical witness audit
        run: python3 preview/oracle-exhaustive-audit.py
      - name: Audit foreground LPH refraction and edge-light operator graph
        run: python3 preview/oracle-foreground-audit.py
      - name: Test real workspace navigation and experimental glass
        run: node --test tests/dashboard-navigation.test.mjs tests/sidebar-glass.test.mjs tests/sidebar-gpu-lab.test.mjs
      - name: Package actual app UI with safe preview entrypoint
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .app-sidebar-preview/app/assets .app-sidebar-preview/assets .app-sidebar-preview/gpu-lab
          cp preview/gpu-lab/* .app-sidebar-preview/gpu-lab/
          cp sites/_apex/app/index.html .app-sidebar-preview/app/index.html
          cp sites/_apex/app/assets/dashboard.css .app-sidebar-preview/app/assets/dashboard.css
          cp sites/_apex/app/assets/workspace-theme.css .app-sidebar-preview/app/assets/workspace-theme.css
          cp sites/_apex/app/assets/workspace-nav.js .app-sidebar-preview/app/assets/workspace-nav.js
          cp sites/_apex/app/assets/sidebar-glass.js .app-sidebar-preview/app/assets/sidebar-glass.js
          cp sites/_apex/app/assets/sidebar-glass-oracle.js .app-sidebar-preview/app/assets/sidebar-glass-oracle.js
          cp sites/_apex/app/assets/sidebar-glass-field-worker.js .app-sidebar-preview/app/assets/sidebar-glass-field-worker.js
          cp sites/_apex/app/assets/sidebar-glass.css .app-sidebar-preview/app/assets/sidebar-glass.css
          cp preview/app-sidebar-bootstrap.js .app-sidebar-preview/app/assets/preview-bootstrap.js
          cp sites/_apex/assets/site-foundation.css .app-sidebar-preview/assets/site-foundation.css
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const file='.app-sidebar-preview/app/index.html';
          const html=readFileSync(file,'utf8');
          const old='src="/app/assets/dashboard.js"';
          if(!html.includes(old))throw Error('Production auth script changed; refusing unsafe preview');
          const updated=html.replace(old,'src="/app/assets/preview-bootstrap.js"')
            .replace('<title>Workspace · DoFinances</title>','<title>Sidebar Preview · DoFinances</title>');
          if(updated.includes(old))throw Error('Unreplaced authentication script');
          writeFileSync(file,updated);
          NODE
          cat > .app-sidebar-preview/index.html <<'HTML'
          <!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex, nofollow"><meta http-equiv="refresh" content="0;url=/app/"><title>Sidebar preview</title></head><body><a href="/app/">Open app sidebar preview</a></body></html>
          HTML
          cat > .app-sidebar-preview/_headers <<'HEADERS'
          /*
            X-Robots-Tag: noindex, nofollow
            Cache-Control: no-store
          HEADERS
          test ! -e .app-sidebar-preview/app/assets/dashboard.js
          grep -Fq 'preview-bootstrap.js' .app-sidebar-preview/app/index.html
          grep -Fq 'workspace-theme.css' .app-sidebar-preview/app/index.html
          grep -Fq 'sidebar-glass.css' .app-sidebar-preview/app/index.html
          grep -Fq 'sidebar-glass.js' .app-sidebar-preview/app/assets/preview-bootstrap.js
          test -s .app-sidebar-preview/app/assets/sidebar-glass.css
          test -s .app-sidebar-preview/app/assets/sidebar-glass.js
          test -s .app-sidebar-preview/app/assets/sidebar-glass-oracle.js
          test -s .app-sidebar-preview/app/assets/sidebar-glass-field-worker.js
          test -s .app-sidebar-preview/gpu-lab/gpu-renderer.js
          test -s .app-sidebar-preview/gpu-lab/index.html
          grep -Fq 'from "./sidebar-glass-oracle.js"' .app-sidebar-preview/app/assets/sidebar-glass.js
          test ! -e .app-sidebar-preview/app/assets/sidebar-glass-refraction.js
          ! grep -Fq 'glass-wallpaper' .app-sidebar-preview/app/assets/sidebar-glass.css
          ! grep -Fq 'dashboard.js' .app-sidebar-preview/app/index.html
          ! grep -R -Eq 'fetch\(|api/auth|location.replace' .app-sidebar-preview/app/assets/*.js
      - name: Exercise actual page-backdrop filter and sidebar at three sizes in Chrome
        shell: bash
        run: |
          set -euo pipefail
          command -v google-chrome
          node --check tests/sidebar-glass-browser-smoke.js
          node --check tests/sidebar-glass-browser-cdp.mjs
          node --check tests/sidebar-gpu-lab-cdp.mjs
          node --check .app-sidebar-preview/app/assets/sidebar-glass-field-worker.js
          node --check .app-sidebar-preview/gpu-lab/gpu-renderer.js
          node --check .app-sidebar-preview/gpu-lab/gpu-lab.js
          cp tests/sidebar-glass-browser-smoke.js .app-sidebar-preview/app/assets/_ci-glass-smoke.js
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync} from 'node:fs';
          const path='.app-sidebar-preview/app/index.html';
          const html=readFileSync(path,'utf8');
          if(!html.includes('</body>'))throw Error('Missing body close');
          writeFileSync(path,html.replace('</body>',
            '<script src="/app/assets/_ci-glass-smoke.js"></script></body>'));
          NODE
          python3 -m http.server 8765 --bind 127.0.0.1 --directory .app-sidebar-preview > "$RUNNER_TEMP/glass-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          # Direct CDP checks avoid Chrome --virtual-time-budget prematurely
          # snapshotting the DOM before the optical filter initializes.
          # The desktop pass also compares actual screenshot PIXELS, in memory,
          # against a same-background blur-only control.
          node tests/sidebar-glass-browser-cdp.mjs
          # Separate controlled-texture WebGPU candidate, never a live sidebar replacement.
          node tests/sidebar-gpu-lab-cdp.mjs
          # Never ship the CI test script or its script tag in the preview.
          node --input-type=module <<'NODE'
          import {readFileSync,writeFileSync,unlinkSync} from 'node:fs';
          const path='.app-sidebar-preview/app/index.html';
          const html=readFileSync(path,'utf8');
          const tag='<script src="/app/assets/_ci-glass-smoke.js"></script>';
          if(!html.includes(tag))throw Error('CI injection vanished');
          writeFileSync(path,html.replace(tag,''));
          unlinkSync('.app-sidebar-preview/app/assets/_ci-glass-smoke.js');
          NODE
          ! grep -Fq '_ci-glass-smoke' .app-sidebar-preview/app/index.html
          test ! -e .app-sidebar-preview/app/assets/_ci-glass-smoke.js
      - name: Deploy to non-production Pages preview branch
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          command: pages deploy .app-sidebar-preview --project-name=dofinances-studio --branch=app-sidebar-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
      - name: Smoke test isolated preview URL
        shell: bash
        run: |
          set -euo pipefail
          url=https://app-sidebar-preview.dofinances-studio.pages.dev/app/
          for attempt in 1 2 3 4 5 6; do
            body="$(mktemp)"
            code="$(curl -sSL --max-time 20 -w '%{http_code}' -o "$body" "$url")"
            if test "$code" = 200 && grep -Fq 'preview-bootstrap.js' "$body"; then
              echo "Isolated app preview verified at $url"
              gpu_url=https://app-sidebar-preview.dofinances-studio.pages.dev/gpu-lab/
              gpu_body="$(mktemp)"
              gpu_code="$(curl -sSL --max-time 20 -w '%{http_code}' -o "$gpu_body" "$gpu_url")"
              if test "$gpu_code" = 200 && grep -Fq 'GPU Liquid Glass' "$gpu_body"; then
                echo "Isolated GPU lab verified at $gpu_url"
                rm "$body" "$gpu_body"
                exit 0
              fi
              rm "$gpu_body"
            fi
            rm "$body"
            sleep 4
          done
          echo 'Preview failed verification; production was not deployed.' >&2
          exit 1
