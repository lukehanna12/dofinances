name: Diagnose wildcard HTTP and DNS
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnostics:
    runs-on: ubuntu-latest
    steps:
      - name: Check public DNS and Worker over HTTP
        shell: bash
        run: |
          echo "Authoritative DNS challenge:"
          dig TXT _acme-challenge.dofinances.com @austin.ns.cloudflare.com +short || true
          echo "Wildcard A:"
          dig ci-probe.dofinances.com A +short || true
          for url in 'http://ci-probe.dofinances.com/' 'http://ci-probe.dofinances.com/nested/hello?x=1' 'http://ci-probe.dofinances.com/missing'; do
            echo "::group::$url"
            curl --silent --show-error --max-time 20 --dump-header - "$url" | head -c 1400 || true
            echo "::endgroup::"
          done
