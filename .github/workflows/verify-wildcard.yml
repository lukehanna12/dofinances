name: Verify wildcard HTTPS and deleted paths
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check HTTPS and that removed pages return 404
        shell: bash
        run: |
          set -euo pipefail
          for url in 'https://ci-probe.dofinances.com/' 'https://ci-probe.dofinances.com/nested/hello?x=1' 'https://another-unconfigured.dofinances.com/anything/here'; do
            code="$(curl --silent --show-error --max-time 25 --output /dev/null --write-out '%{http_code}' "$url")"
            echo "$url -> $code"
            test "$code" = 404
          done
          echo 'Wildcard TLS and page deletion behavior verified'
