name: Dashboard preview (isolated)

on:
  push:
    branches: [dashboard-preview]
  workflow_dispatch:

permissions:
  contents: read

# Independent of the production deployment lock and Collections commits.
concurrency:
  group: dofinances-dashboard-preview
  cancel-in-progress: true

jobs:
  preview:
    name: Publish static Dashboard preview only
    runs-on: ubuntu-latest
    steps:
      - name: Checkout preview branch
        uses: actions/checkout@v6

      - name: Assemble non-authenticated, no-navigation Dashboard copy
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/app/assets dist/assets
          # The Studio HTML is a public-safe mirror of the production Home
          # and entire real sidebar, without protected dashboard controllers.
          python3 studio/dashboard-preview/compose.py
          cp studio/dashboard-preview/home.css dist/app/assets/dashboard-home.css
          cp studio/dashboard-preview/home.js dist/app/assets/dashboard-mosaic.js
          cp studio/dashboard-preview/optics.js dist/app/assets/dashboard-optics.js
          cp studio/dashboard-preview/test-optics.mjs dist/app/assets/dashboard-optics.test.mjs
          cp sites/_apex/app/assets/sidebar-glass-oracle.js dist/app/assets/sidebar-glass-oracle.js

          cp sites/_apex/assets/site-foundation.css dist/assets/
          for asset in \
            dashboard.css workspace-theme.css sidebar-glass.css \
            workspace-wallpapers.css workspace-enhancements.css \
            diagnostics.css providers.css \
            workspace-scroll.js workspace-wallpapers.js \
            magnifying-glass.v2.svg dashboard-screen-sidebar-icon.v1.svg \
            collections-screen-sidebar-icon.v1.svg settings-screen-sidebar-icon.v1.svg \
            home-rice-terraces-hq.jpg; do
            cp "sites/_apex/app/assets/$asset" "dist/app/assets/$asset"
          done
          cp studio/dashboard-preview/bootstrap.js dist/app/assets/dashboard-preview.js
          printf '/*\n  X-Robots-Tag: noindex, nofollow\n  Cache-Control: no-store\n' > dist/_headers
          printf 'User-agent: *\nDisallow: /\n' > dist/robots.txt

      - name: Check preview boundaries
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/index.html
          test -s dist/app/assets/dashboard-preview.js
          test -s dist/app/assets/dashboard-home.css
          test -s dist/app/assets/dashboard-mosaic.js
          test -s dist/app/assets/dashboard-optics.js
          test -s dist/app/assets/sidebar-glass-oracle.js
          grep -Fq 'data-view="home"' dist/index.html
          grep -Fq 'id="cta6-mosaic"' dist/index.html
          grep -Fq 'dashboard-optics.js' dist/index.html
          grep -Fq 'airMode5SDF(' dist/app/assets/dashboard-optics.js
          grep -Fq 'airRefractionEnvelope(' dist/app/assets/dashboard-optics.js
          grep -Fq 'feDisplacementMap' dist/app/assets/dashboard-optics.js
          grep -Fq 'SourceGraphic' dist/app/assets/dashboard-optics.js
          grep -Fq 'GAP LG-Q-NUMERICAL' dist/app/assets/dashboard-home.css
          grep -Fq 'actual painted DOM' dist/app/assets/dashboard-optics.js
          node --check dist/app/assets/dashboard-optics.js
          node --check dist/app/assets/sidebar-glass-oracle.js
          # Node's module default varies by runner; mark this test-only
          # directory as ESM, then remove the marker before Pages deployment.
          echo '{"type":"module"}' > dist/app/assets/package.json
          node --test dist/app/assets/dashboard-optics.test.mjs
          rm dist/app/assets/package.json
          grep -Fq 'Dashboard Preview · DoFinances' dist/index.html
          ! grep -Fq 'Your workspace, all in one place.' dist/index.html
          grep -Fq 'cta6-center' dist/index.html
          grep -Fq 'positionIcons' dist/app/assets/dashboard-mosaic.js
          ! grep -Fq 'id="workspace-sidebar"' dist/index.html
          ! grep -Fq 'id="sidebar-resize-handle"' dist/index.html
          ! grep -Fq 'id="mobile-nav-toggle"' dist/index.html
          grep -Fq 'rgba(21,26,32,.77)' dist/app/assets/dashboard-home.css
          grep -Fq 'backdrop-filter:blur(6.4px)' dist/app/assets/dashboard-home.css
          grep -Fq 'color:#000' dist/app/assets/dashboard-home.css
          ! grep -Fq 'initLiquidGlassSidebar' dist/app/assets/dashboard-preview.js
          ! grep -Fq 'initWorkspaceNavigation' dist/app/assets/dashboard-preview.js
          node --check dist/app/assets/dashboard-preview.js
          node --check dist/app/assets/dashboard-mosaic.js
          grep -Fq 'dashboard-preview.js' dist/index.html
          test ! -e dist/app/assets/dashboard.js
          test ! -e dist/app/assets/collections.js
          test ! -e dist/app/assets/permissions.js
          test ! -e dist/app/assets/cloudflare-settings.js
          ! grep -R -Eq '/api/auth/|/api/colosseum/|/api/cloudflare/' dist/app/assets/*.js
          ! grep -Fq 'preview-bootstrap.js' dist/index.html
          echo 'Standalone, read-only Dashboard preview verified'

      - name: Browser smoke — live optical filter and unchanged mosaic
        shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo 'No Chrome executable on GitHub runner; cannot certify SVG backdrop support'
            exit 1
          fi
          python3 -m http.server 8765 --directory dist >/tmp/dashboard-preview-http.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          sleep 1
          "$CHROME" --headless --no-sandbox --enable-unsafe-swiftshader --disable-dev-shm-usage \
            --window-size=1440,900 --virtual-time-budget=15000 --dump-dom \
            http://127.0.0.1:8765/ >/tmp/dashboard-preview-live-dom.html \
            2>/tmp/dashboard-preview-chrome-stderr.log || {
              tail -80 /tmp/dashboard-preview-chrome-stderr.log
              exit 1
            }
          grep -Fq 'cta6-tile--glass' /tmp/dashboard-preview-live-dom.html
          grep -Fq 'dashboard-optics.js' /tmp/dashboard-preview-live-dom.html
          ! grep -Fq 'id="workspace-sidebar"' /tmp/dashboard-preview-live-dom.html
          # A decoded geometry-only filter sets this marker only after all
          # three per-pane field maps commit to the live SVG backdrop filter.
          grep -Fq 'data-oracle-optical-mode="live-backdrop"' /tmp/dashboard-preview-live-dom.html || {
            echo 'Browser did not activate the live optical filter'
            tail -35 /tmp/dashboard-preview-chrome-stderr.log
            exit 1
          }
          echo 'Live SVG backdrop filter active; source-field geometry and no-sidebar verified'

      - name: Deploy preview branch to distinct Pages URL
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          # Same Pages project, DIFFERENT branch deployment:
          # no production route, DNS change, main commit, or Worker deploy.
          command: pages deploy dist --project-name=dofinances-studio --branch=dashboard-preview
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
