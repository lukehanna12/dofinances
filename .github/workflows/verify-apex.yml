name: Verify apex stage
on: workflow_dispatch
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          set -euo pipefail
          curl -fsS https://dofinances.com/__ci_probe/test | grep 'Apex CI overlay probe'
          curl -fsSI https://dofinances.com/
          code="$(curl -sS -o /dev/null -w '%{http_code}' https://dofinances.com/__ci_probe/unregistered)"
          echo "GoDaddy fallback HTTP status: $code"
          test "${code:0:1}" != 5
