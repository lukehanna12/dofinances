name: Build and deploy Dofinances

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dofinances-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify distribution
        run: |
          test -s dist/index.html
          test -d dist/assets
      - name: Save built site for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dofinances-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: dofinances-production
      cancel-in-progress: false
    steps:
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dofinances-dist
          path: dist
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          command: pages deploy dist --project-name=dofinances-studio --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-host-router:
    name: Deploy Git-managed host/page router
    needs: build
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Publish Git-managed Worker (routes managed separately)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          command: deploy --config edge/wrangler.jsonc

  smoke:
    name: Confirm live sites after deployment
    needs: [deploy, deploy-host-router]
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check public HTTPS, Git-managed homepage, studio and wildcard
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 https://dofinances.com/ | grep -Fq 'Dofinances' &&
               curl -fsSL --max-time 20 https://www.dofinances.com/ | grep -Fq 'Dofinances' &&
               curl -fsSL --max-time 20 https://stu.dofinances.com/ >/dev/null &&
               test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://ci-probe.dofinances.com/)" = 404; then
              passed=true
              break
            fi
            sleep 4
          done
          test "$passed" = true
          echo 'Git-managed apex, www, studio and wildcard checks passed'

      - name: Verify login page and static assets
        shell: bash
        run: |
          set -euo pipefail
          for path in /login /login/ /login/index.html /login/assets/auth3.css /login/assets/auth3.js; do
            tmp="$(mktemp)"
            http="$(curl -sSL --max-time 20 -o "$tmp" -w '%{http_code}' "https://dofinances.com$path" || true)"
            echo "GET $path => HTTP $http; bytes=$(wc -c < "$tmp")"
            if [ "$http" != "200" ]; then
              head -c 350 "$tmp" || true
              echo
            fi
            if [ "$path" = "/login" ]; then
              test "$http" = "200"
              grep -Fq 'Sign in' "$tmp"
              grep -Fq '/login/assets/auth3.css' "$tmp"
            fi
            if [ "$path" = "/login/assets/auth3.css" ]; then
              test "$http" = "200"
              grep -Fq 'auth3__card' "$tmp"
            fi
            if [ "$path" = "/login/assets/auth3.js" ]; then
              test "$http" = "200"
              grep -Fq 'sign-in' "$tmp"
            fi
            rm -f "$tmp"
          done
