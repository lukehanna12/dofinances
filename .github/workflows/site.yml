name: Build and deploy Dofinances

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dofinances-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify distribution
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/_routes.json
          test ! -e dist/login/index.html
          grep -Fq 'await fetch' src/components/Auth3.jsx
          test -s sites/_apex/app/index.html
          test -s sites/_apex/assets/site-foundation.css
          test -s sites/_apex/assets/account-security.css
          grep -Fq -- '--ui-canvas: #000000' sites/_apex/assets/site-foundation.css
          grep -R -Fq -- '--ui-font-sans' dist/assets
          test -s sites/_apex/app/assets/dashboard.js
          grep -Fq 'https://send.api.mailtrap.io/api/send' edge/auth-mail.mjs
          ! grep -Fq 'api.sendgrid.com' edge/auth-mail.mjs
          grep -Fq 'Sign in · Dofinances' dist/index.html
          test -d dist/assets
      - name: Save built site for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dofinances-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: dofinances-production
      cancel-in-progress: false
    steps:
      - name: Checkout Pages route handler
        uses: actions/checkout@v6
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dofinances-dist
          path: dist
      - name: Package static Liquid Glass Studio without modifying apex login build
        shell: bash
        run: |
          set -euo pipefail
          # The Vite build artifact downloaded independently by the Worker
          # job still supplies the real Auth-3 apex /login page.
          # Only this Pages deployment's dist/ copy becomes the standalone
          # Studio preview. No auth JS or test-branch dependency is included.
          mkdir -p dist/app/assets dist/assets
          cp studio/sidebar/index.html dist/index.html
          cp studio/sidebar/index.html dist/app/index.html
          cp sites/_apex/app/assets/dashboard.css dist/app/assets/dashboard.css
          cp sites/_apex/app/assets/workspace-theme.css dist/app/assets/workspace-theme.css
          cp sites/_apex/app/assets/workspace-nav.js dist/app/assets/workspace-nav.js
          cp sites/_apex/app/assets/workspace-wallpapers.js dist/app/assets/workspace-wallpapers.js
          cp sites/_apex/app/assets/workspace-wallpapers.css dist/app/assets/workspace-wallpapers.css
          cp sites/_apex/app/assets/sidebar-glass-oracle.js dist/app/assets/sidebar-glass-oracle.js
          cp sites/_apex/app/assets/sidebar-glass-field-worker.js dist/app/assets/sidebar-glass-field-worker.js
          cp studio/sidebar/sidebar-glass.css dist/app/assets/sidebar-glass.css
          cp studio/sidebar/sidebar-glass.js dist/app/assets/sidebar-glass.js
          cp studio/sidebar/preview-bootstrap.js dist/app/assets/preview-bootstrap.js
          cp sites/_apex/assets/site-foundation.css dist/assets/site-foundation.css
          test ! -e dist/app/assets/dashboard.js
          grep -Fq 'preview-bootstrap.js' dist/index.html
          grep -Fq 'sidebar-glass.css' dist/app/index.html
          grep -Fq 'initLiquidGlassSidebar' dist/app/assets/preview-bootstrap.js
          grep -Fq 'glass-scene-toggle' dist/app/assets/sidebar-glass.js
          grep -Fq 'body:has(> #workspace-shell.liquid-glass-preview)' dist/app/assets/sidebar-glass.css
          ! grep -Fq 'auth3-studio-preview-v1' dist/index.html
          ! grep -R -Eq 'fetch\(|api/auth|location.replace' dist/app/assets/*.js
          cmp studio/sidebar/sidebar-glass.css dist/app/assets/sidebar-glass.css
          cmp sites/_apex/app/assets/sidebar-glass-oracle.js dist/app/assets/sidebar-glass-oracle.js
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          command: pages deploy dist --project-name=dofinances-studio --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-host-router:
    name: Deploy Git-managed host/page router
    needs: build
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download built Studio for apex /login
        uses: actions/download-artifact@v4
        with:
          name: dofinances-dist
          path: dist
      - name: Package the Studio preview at the apex /login path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sites/_apex/login sites/_apex/assets
          cp dist/index.html sites/_apex/login/index.html
          cp -R dist/assets/. sites/_apex/assets/
          test -s sites/_apex/login/index.html
          grep -Fq 'auth3-studio-preview-v1' sites/_apex/login/index.html
      - name: Publish Git-managed Worker (routes managed separately)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          command: deploy --config edge/wrangler.jsonc

  smoke:
    name: Confirm live sites after deployment
    needs: [deploy, deploy-host-router]
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check public HTTPS, Git-managed homepage, studio and wildcard
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3 4 5; do
            if curl -fsSL --max-time 20 https://dofinances.com/ | grep -Fq 'DoFinances' &&
               curl -fsSL --max-time 20 https://www.dofinances.com/ | grep -Fq 'DoFinances' &&
               curl -fsSL --max-time 20 https://stu.dofinances.com/ >/dev/null &&
               test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://ci-probe.dofinances.com/)" = 404; then
              passed=true
              break
            fi
            sleep 4
          done
          test "$passed" = true
          echo 'Git-managed apex, www, studio and wildcard checks passed'

      - name: Verify Studio glass root, apex login, and deleted Studio login routes
        shell: bash
        run: |
          set -euo pipefail
          studio_body="$(mktemp)"
          studio_ready=false
          # Probe a fresh URL after deployment to distinguish a stale Pages
          # edge response from a failed static-asset package. Always inspect
          # the full workspace marker; HTTP 200 alone is insufficient.
          for attempt in 1 2 3 4 5 6; do
            studio_code="$(curl --retry 2 --retry-delay 2 -fsSL --max-time 20 -H 'Cache-Control: no-cache' -w '%{http_code}' -o "$studio_body" "https://stu.dofinances.com/?studio_release=${GITHUB_RUN_ID}-${attempt}")"
            echo "Studio root probe $attempt -> HTTP $studio_code ($(wc -c < "$studio_body") bytes)"
            if test "$studio_code" = 200 &&
               grep -Fq 'preview-bootstrap.js' "$studio_body" &&
               grep -Fq 'id="workspace-sidebar"' "$studio_body" &&
               grep -Fq 'sidebar-glass.css' "$studio_body" &&
               ! grep -Fq 'auth3-studio-preview-v1' "$studio_body"; then
              studio_ready=true
              break
            fi
            echo "Unexpected Studio HTML markers:"
            grep -Eo '<title>[^<]+|studio-empty-v1|auth3-studio-preview-v1|preview-bootstrap\.js' "$studio_body" | head -12 || true
            sleep 5
          done
          if test "$studio_ready" != true; then
            echo "Live Studio is not the expected static sidebar; refusing preview retirement." >&2
            exit 1
          fi
          rm "$studio_body"
          for route in /app/ /app/assets/sidebar-glass.css /app/assets/sidebar-glass.js /app/assets/sidebar-glass-oracle.js /app/assets/sidebar-glass-field-worker.js /app/assets/preview-bootstrap.js /assets/site-foundation.css; do
            code="$(curl --retry 3 --retry-delay 2 -sSL --max-time 20 -w '%{http_code}' -o /dev/null "https://stu.dofinances.com$route")"
            echo "Studio $route -> HTTP $code"
            test "$code" = 200
          done
          studio_app="$(mktemp)"
          curl -fsSL --max-time 20 https://stu.dofinances.com/app/ > "$studio_app"
          grep -Fq 'id="workspace-sidebar"' "$studio_app"
          grep -Fq 'preview-bootstrap.js' "$studio_app"
          rm "$studio_app"
          for url in https://dofinances.com/login https://dofinances.com/login/; do
            body="$(mktemp)"
            code="$(curl --retry 3 --retry-delay 2 -fsSL --max-time 20 -w '%{http_code}' -o "$body" "$url")"
            echo "$url -> HTTP $code ($(wc -c < "$body") bytes)"
            test "$code" = 200
            grep -Fq 'Sign in · Dofinances' "$body"
            grep -Fq 'auth3-studio-preview-v1' "$body"
            rm "$body"
          done
          for url in https://stu.dofinances.com/login https://stu.dofinances.com/login/; do
            code="$(curl --retry 3 --retry-delay 2 -sSL --max-time 20 -w '%{http_code}' -o /dev/null "$url")"
            echo "$url -> HTTP $code (expected 404)"
            test "$code" = 404
          done

      - name: Verify library-iii wallpaper images, crop resolution and shared stylesheet
        shell: bash
        run: |
          set -euo pipefail
          source_js="$(mktemp)"
          source_css="$(mktemp)"
          curl --retry 3 --retry-delay 2 -fsSL --max-time 20 https://stu.dofinances.com/app/assets/workspace-wallpapers.js -o "$source_js"
          curl --retry 3 --retry-delay 2 -fsSL --max-time 20 https://stu.dofinances.com/app/assets/workspace-wallpapers.css -o "$source_css"
          grep -Fq -- '--workspace-header-height' "$source_css"
          python3 - "$source_js" <<'PY'
          import re, sys, subprocess, tempfile, struct, os

          js = open(sys.argv[1], encoding="utf-8").read()
          assets = list(dict.fromkeys(re.findall(r'"sha":\s*"([a-f0-9]{64})",\s*"ext":\s*"(jpg|png|webp|avif)"', js)))
          assert len(assets) == 8, f"Expected eight distinct wallpaper assets, got {len(assets)}"
          def dimensions(data):
              if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return struct.unpack(">II", data[16:24])
              if data.startswith(b"\xff\xd8"):
                  i = 2
                  while i < len(data) - 10:
                      if data[i] != 0xff:
                          i += 1
                          continue
                      marker = data[i+1]
                      i += 2
                      if marker in (0xd8, 0xd9) or 0xd0 <= marker <= 0xd7:
                          continue
                      size = int.from_bytes(data[i:i+2], "big")
                      if marker in (0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf):
                          return (int.from_bytes(data[i+5:i+7],"big"), int.from_bytes(data[i+3:i+5],"big"))
                      i += size
              return None

          for sha, ext in assets:
              url = f"https://dofinances.com/wallpapers/{sha}.{ext}"
              with tempfile.NamedTemporaryFile() as tmp, tempfile.NamedTemporaryFile() as hdr:
                  command = ["curl", "--retry", "3", "--retry-delay", "2", "-fsSL", "--max-time", "35", "-D", hdr.name, "-o", tmp.name, url]
                  subprocess.run(command, check=True)
                  content = open(tmp.name, "rb").read()
                  headers = open(hdr.name, encoding="latin-1").read().lower()
                  mime = {"jpg":"image/jpeg","png":"image/png","webp":"image/webp","avif":"image/avif"}[ext]
                  assert f"content-type: {mime}" in headers, f"Unexpected MIME for {sha}: {headers[-900:]}"
                  assert len(content) > 50_000, f"Image unexpectedly small: {sha}"
                  dims = dimensions(content)
                  assert dims is not None, f"Could not parse image dimensions: {sha}"
                  width, height = dims
                  assert width >= 1280 and height >= 300, f"Insufficient wallpaper resolution: {sha} {dims}"
                  print(f"Verified {sha[:12]}.{ext}: {width} x {height}, {len(content):,} bytes; full-width banner crop")
          PY
          invalid="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://dofinances.com/wallpapers/not-allowlisted.jpg)"
          test "$invalid" = 404
          rm "$source_js" "$source_css"
          echo 'All eight library-iii wallpapers and the shared Studio stylesheet are live'

      - name: Verify authentication boundaries and new account security routes
        shell: bash
        run: |
          set -euo pipefail
          base=https://dofinances.com
          check() {
            local method="$1" path="$2" expected="$3"
            local code
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X "$method" "$base$path")"
            echo "$method $path -> $code (expected $expected)"
            test "$code" = "$expected"
          }
          check GET /app 302
          check GET /api/auth/me 401
          check GET /api/auth/mfa/status 401
          check GET /verify 200
          check GET /reset 200
          configuration="$(curl -fsS --max-time 20 "$base/api/auth/config")"
          echo "$configuration" | grep -Fq '"mfaAvailable":true'
          echo "$configuration" | grep -Fq '"emailAvailable":'
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://evil.example' \
            -d '{}' "$base/api/auth/password/forgot")"
          test "$code" = 403
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://dofinances.com' \
            -d '{"token":"invalid"}' "$base/api/auth/verification/confirm")"
          test "$code" = 400
          echo "Authentication access boundaries verified; sending is tested separately after email provider activation"
