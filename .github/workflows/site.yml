name: Build and deploy Dofinances

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dofinances-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run tests
        run: npm run check
      - name: Build site
        run: npm run build
      - name: Verify distribution
        run: |
          test -s dist/index.html
          test -s dist/404.html
          test -s dist/_routes.json
          test ! -e dist/login/index.html
          grep -Fq 'await fetch' src/components/Auth3.jsx
          test -s sites/_apex/app/index.html
          test -s sites/_apex/assets/site-foundation.css
          test -s sites/_apex/assets/account-security.css
          grep -Fq -- '--ui-canvas: #171717' sites/_apex/assets/site-foundation.css
          grep -R -Fq -- '--ui-font-sans' dist/assets
          test -s sites/_apex/app/assets/dashboard.js
          test -s sites/_apex/app/assets/workspace-scroll.js
          grep -Fq 'id="workspace-scroll"' sites/_apex/app/index.html
          grep -Fq '© DoFinances · 2026' sites/_apex/app/index.html
          grep -Fq 'https://send.api.mailtrap.io/api/send' edge/auth-mail.mjs
          ! grep -Fq 'api.sendgrid.com' edge/auth-mail.mjs
          grep -Fq 'Sign in · Dofinances' dist/index.html
          test -d dist/assets
      - name: Save built site for deployment
        uses: actions/upload-artifact@v4
        with:
          name: dofinances-dist
          path: dist/
          if-no-files-found: error
          retention-days: 3

  deploy:
    name: Deploy to Cloudflare Pages
    needs: build
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
      deployments: write
    concurrency:
      group: dofinances-production
      cancel-in-progress: false
    steps:
      - name: Checkout Pages route handler
        uses: actions/checkout@v6
      - name: Download built site
        uses: actions/download-artifact@v4
        with:
          name: dofinances-dist
          path: dist
      - name: Package static Liquid Glass Studio without modifying apex login build
        shell: bash
        run: |
          set -euo pipefail
          # The Vite build artifact downloaded independently by the Worker
          # job still supplies the real Auth-3 apex /login page.
          # Only this Pages deployment's dist/ copy becomes the standalone
          # Studio preview. No auth JS or test-branch dependency is included.
          mkdir -p dist/app/assets dist/assets dist/gallery/assets
          cp studio/gallery/index.html dist/index.html
          cp studio/sidebar/index.html dist/app/index.html
          cp studio/gallery/gallery.css dist/gallery/assets/gallery.css
          cp studio/gallery/gallery.js dist/gallery/assets/gallery.js
          cp studio/gallery/gallery-field-worker.js dist/gallery/assets/gallery-field-worker.js
          cp sites/_apex/app/assets/dashboard.css dist/app/assets/dashboard.css
          cp sites/_apex/app/assets/workspace-theme.css dist/app/assets/workspace-theme.css
          cp sites/_apex/app/assets/workspace-nav.js dist/app/assets/workspace-nav.js
          cp sites/_apex/app/assets/collections-title-transition.js dist/app/assets/collections-title-transition.js
          cp sites/_apex/app/assets/workspace-scroll.js dist/app/assets/workspace-scroll.js
          cp sites/_apex/app/assets/workspace-wallpapers.js dist/app/assets/workspace-wallpapers.js
          cp sites/_apex/app/assets/workspace-wallpapers.css dist/app/assets/workspace-wallpapers.css
          cp sites/_apex/app/assets/workspace-enhancements.css dist/app/assets/workspace-enhancements.css
          cp sites/_apex/app/assets/magnifying-glass.v2.svg dist/app/assets/magnifying-glass.v2.svg
          cp sites/_apex/app/assets/dashboard-screen-sidebar-icon.v1.svg dist/app/assets/dashboard-screen-sidebar-icon.v1.svg
          cp sites/_apex/app/assets/collections-screen-sidebar-icon.v1.svg dist/app/assets/collections-screen-sidebar-icon.v1.svg
          cp sites/_apex/app/assets/settings-screen-sidebar-icon.v1.svg dist/app/assets/settings-screen-sidebar-icon.v1.svg
          cp sites/_apex/app/assets/add-collection.v1.svg dist/app/assets/add-collection.v1.svg
          cp sites/_apex/app/assets/diagnostics.css dist/app/assets/diagnostics.css
          cp sites/_apex/app/assets/providers.css dist/app/assets/providers.css
          cp sites/_apex/app/assets/home-rice-terraces-hq.jpg dist/app/assets/home-rice-terraces-hq.jpg
          cp sites/_apex/app/assets/sidebar-glass-oracle.js dist/app/assets/sidebar-glass-oracle.js
          cp sites/_apex/app/assets/sidebar-glass-field-worker.js dist/app/assets/sidebar-glass-field-worker.js
          cp studio/sidebar/sidebar-glass.css dist/app/assets/sidebar-glass.css
          cp studio/sidebar/sidebar-glass.js dist/app/assets/sidebar-glass.js
          cp studio/sidebar/preview-bootstrap.js dist/app/assets/preview-bootstrap.js
          cp sites/_apex/assets/site-foundation.css dist/assets/site-foundation.css
          test -s dist/app/assets/collections-title-transition.js
          test -s dist/app/assets/magnifying-glass.v2.svg
          test -s dist/app/assets/dashboard-screen-sidebar-icon.v1.svg
          test -s dist/app/assets/collections-screen-sidebar-icon.v1.svg
          test -s dist/app/assets/settings-screen-sidebar-icon.v1.svg
          test -s dist/app/assets/add-collection.v1.svg
          test -s dist/app/assets/home-rice-terraces-hq.jpg
          grep -Fq 'global-menu' dist/app/index.html
          grep -Fq 'workspace-enhancements.css' dist/app/index.html
          test ! -e dist/app/assets/dashboard.js
          grep -Fq 'id="background-switcher"' dist/index.html
          grep -Fq 'id="specimen-panel"' dist/index.html
          grep -Fq 'id="specimen-toggle"' dist/index.html
          grep -Fq 'src="/gallery/assets/gallery.js"' dist/index.html
          test -s dist/gallery/assets/gallery.css
          test -s dist/gallery/assets/gallery.js
          test -s dist/gallery/assets/gallery-field-worker.js
          grep -Fq 'preview-bootstrap.js' dist/app/index.html
          grep -Fq 'sidebar-glass.css' dist/app/index.html
          grep -Fq 'initLiquidGlassSidebar' dist/app/assets/preview-bootstrap.js
          grep -Fq 'glass-scene-toggle' dist/app/assets/sidebar-glass.js
          grep -Fq 'body:has(> #workspace-shell.liquid-glass-preview)' dist/app/assets/sidebar-glass.css
          ! grep -Fq 'auth3-studio-preview-v1' dist/index.html
          ! grep -R -Eq 'fetch\(|api/auth|location.replace' dist/app/assets/*.js
          cmp studio/sidebar/sidebar-glass.css dist/app/assets/sidebar-glass.css
          cmp sites/_apex/app/assets/sidebar-glass-oracle.js dist/app/assets/sidebar-glass-oracle.js
      - name: Publish to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          command: pages deploy dist --project-name=dofinances-studio --branch=main
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  deploy-host-router:
    name: Deploy Git-managed host/page router
    needs: build
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    environment: cloudflare-production
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Download built Studio for apex /login
        uses: actions/download-artifact@v4
        with:
          name: dofinances-dist
          path: dist
      - name: Package the Studio preview at the apex /login path
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p sites/_apex/login sites/_apex/assets
          cp dist/index.html sites/_apex/login/index.html
          cp -R dist/assets/. sites/_apex/assets/
          test -s sites/_apex/login/index.html
          grep -Fq 'auth3-studio-preview-v1' sites/_apex/login/index.html
      - name: Publish Git-managed Worker (routes managed separately)
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_WORKERS_API_TOKEN || secrets.CLOUDFLARE_API_TOKEN }}
          accountId: '7d0d4c74836717a4d23784bbf8d5ccd7'
          command: deploy --config edge/wrangler.jsonc

  smoke:
    name: Confirm live sites after deployment
    needs: [deploy, deploy-host-router]
    if: >-
      ${{ github.event_name != 'pull_request' &&
          github.ref == 'refs/heads/main' &&
          vars.DEPLOY_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout UI validation script
        uses: actions/checkout@v6
      - name: Check public HTTPS, Git-managed homepage, studio and wildcard
        shell: bash
        run: |
          set -euo pipefail
          passed=false
          for attempt in 1 2 3 4 5; do
            if curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL --max-time 20 https://dofinances.com/ | grep -F 'DoFinances' >/dev/null &&
               curl --retry 4 --retry-all-errors --retry-delay 2 -fsSL --max-time 20 https://www.dofinances.com/ | grep -F 'DoFinances' >/dev/null &&
               curl -fsSL --max-time 20 https://stu.dofinances.com/ >/dev/null &&
               test "$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://ci-probe.dofinances.com/)" = 404; then
              passed=true
              break
            fi
            sleep 4
          done
          test "$passed" = true
          echo 'Git-managed apex, www, studio and wildcard checks passed'

      - name: Verify Studio glass root, apex login, and deleted Studio login routes
        shell: bash
        run: |
          set -euo pipefail
          studio_body="$(mktemp)"
          studio_ready=false
          # Probe the gallery root with a release-unique URL to distinguish a stale
          # Pages response from the current deployment. The old sidebar demo
          # remains independently checked at /app/.
          for attempt in 1 2 3 4 5 6; do
            studio_code="$(curl --retry 2 --retry-delay 2 -fsSL --max-time 20 -H 'Cache-Control: no-cache' -w '%{http_code}' -o "$studio_body" "https://stu.dofinances.com/?studio_release=${GITHUB_RUN_ID}-${attempt}")"
            echo "Studio root probe $attempt -> HTTP $studio_code ($(wc -c < "$studio_body") bytes)"
            if test "$studio_code" = 200 &&
               grep -Fq 'id="background-switcher"' "$studio_body" &&
               grep -Fq 'id="specimen-panel"' "$studio_body" &&
               grep -Fq 'id="specimen-toggle"' "$studio_body" &&
               grep -Fq '/gallery/assets/gallery.js' "$studio_body" &&
               ! grep -Fq 'auth3-studio-preview-v1' "$studio_body"; then
              studio_ready=true
              break
            fi
            echo "Unexpected Studio HTML markers:"
            grep -Eo '<title>[^<]+|studio-empty-v1|auth3-studio-preview-v1|gallery\.js' "$studio_body" | head -12 || true
            sleep 5
          done
          if test "$studio_ready" != true; then
            echo "Live Studio root is not the expected Liquid Glass gallery." >&2
            exit 1
          fi
          rm "$studio_body"
          for route in /gallery/assets/gallery.css /gallery/assets/gallery.js /gallery/assets/gallery-field-worker.js /app/ /app/assets/collections-title-transition.js /app/assets/sidebar-glass.css /app/assets/sidebar-glass.js /app/assets/sidebar-glass-oracle.js /app/assets/sidebar-glass-field-worker.js /app/assets/preview-bootstrap.js /assets/site-foundation.css; do
            code="$(curl --retry 3 --retry-delay 2 -sSL --max-time 20 -w '%{http_code}' -o /dev/null "https://stu.dofinances.com$route")"
            echo "Studio $route -> HTTP $code"
            test "$code" = 200
          done
          studio_app="$(mktemp)"
          curl -fsSL --max-time 20 https://stu.dofinances.com/app/ > "$studio_app"
          grep -Fq 'id="workspace-sidebar"' "$studio_app"
          grep -Fq 'id="workspace-scroll"' "$studio_app"
          grep -Fq '© DoFinances · 2026' "$studio_app"
          grep -Fq 'global-menu' "$studio_app"
          grep -Fq 'Manage Account' "$studio_app"
          grep -Fq 'preview-bootstrap.js' "$studio_app"
          rm "$studio_app"
          for url in https://dofinances.com/login https://dofinances.com/login/; do
            body="$(mktemp)"
            code="$(curl --retry 3 --retry-delay 2 -fsSL --max-time 20 -w '%{http_code}' -o "$body" "$url")"
            echo "$url -> HTTP $code ($(wc -c < "$body") bytes)"
            test "$code" = 200
            grep -Fq 'Sign in · Dofinances' "$body"
            grep -Fq 'auth3-studio-preview-v1' "$body"
            rm "$body"
          done
          for url in https://stu.dofinances.com/login https://stu.dofinances.com/login/; do
            code="$(curl --retry 3 --retry-delay 2 -sSL --max-time 20 -w '%{http_code}' -o /dev/null "$url")"
            echo "$url -> HTTP $code (expected 404)"
            test "$code" = 404
          done

      - name: Verify Git-hosted Home wallpaper, library-iii images and shared stylesheet
        shell: bash
        run: |
          set -euo pipefail
          source_js="$(mktemp)"
          source_css="$(mktemp)"
          curl --retry 3 --retry-delay 2 -fsSL --max-time 20 https://stu.dofinances.com/app/assets/workspace-wallpapers.js -o "$source_js"
          curl --retry 3 --retry-delay 2 -fsSL --max-time 20 https://stu.dofinances.com/app/assets/workspace-wallpapers.css -o "$source_css"
          grep -Fq -- '--workspace-header-height' "$source_css"
          grep -Fq -- '--workspace-footer-height' "$source_css"
          grep -Fq -- 'position:absolute;' "$source_css"
          ! grep -Fq -- 'workspace-at-end' "$source_css"
          python3 - "$source_js" <<'PY'
          import re, sys, subprocess, tempfile, struct, os

          js = open(sys.argv[1], encoding="utf-8").read()
          assets = list(dict.fromkeys(re.findall(r'"sha":\s*"([a-f0-9]{64})",\s*"ext":\s*"(jpg|png|webp|avif)",\s*"name":\s*"[^"]+"(?:,\s*"path":\s*"([^"]+)")?', js)))
          assert len(assets) == 8, f"Expected eight distinct wallpaper assets, got {len(assets)}"
          def dimensions(data):
              # PNG IHDR
              if data.startswith(b"\x89PNG\r\n\x1a\n"):
                  return struct.unpack(">II", data[16:24])
              # JPEG SOF marker
              if data.startswith(b"\xff\xd8"):
                  i = 2
                  while i < len(data) - 10:
                      if data[i] != 0xff:
                          i += 1
                          continue
                      marker = data[i+1]
                      i += 2
                      if marker in (0xd8, 0xd9) or 0xd0 <= marker <= 0xd7:
                          continue
                      size = int.from_bytes(data[i:i+2], "big")
                      if size < 2:
                          break
                      if marker in (0xc0, 0xc1, 0xc2, 0xc3, 0xc5, 0xc6, 0xc7, 0xc9, 0xca, 0xcb, 0xcd, 0xce, 0xcf):
                          return (int.from_bytes(data[i+5:i+7],"big"), int.from_bytes(data[i+3:i+5],"big"))
                      i += size
              # WebP RIFF VP8X, VP8L and VP8 frame headers
              if data[:4] == b"RIFF" and data[8:12] == b"WEBP":
                  kind=data[12:16]
                  if kind==b"VP8X" and len(data)>=30:
                      return (1+int.from_bytes(data[24:27],"little"),1+int.from_bytes(data[27:30],"little"))
                  if kind==b"VP8L" and len(data)>=25 and data[20]==0x2f:
                      b1,b2,b3,b4=data[21:25]
                      return (1+b1+((b2&0x3f)<<8),1+(b2>>6)+(b3<<2)+((b4&0xf)<<10))
                  if kind==b"VP8 ":
                      at=data.find(b"\x9d\x01\x2a",20,128)
                      if at>=0 and len(data)>=at+7:
                          return (int.from_bytes(data[at+3:at+5],"little")&0x3fff,
                                  int.from_bytes(data[at+5:at+7],"little")&0x3fff)
              # AVIF uses an ISO-BMFF image spatial extents (ispe) property.
              if b"avif" in data[8:32] or b"avis" in data[8:32]:
                  at=data.find(b"ispe")
                  if at>=4 and len(data)>=at+16:
                      width,height=struct.unpack(">II",data[at+8:at+16])
                      if 0<width<100000 and 0<height<100000:
                          return (width,height)
              return None
          for sha, ext, path in assets:
              url = "https://stu.dofinances.com" + path if path else f"https://dofinances.com/wallpapers/{sha}.{ext}"
              if path:
                  assert path == "/app/assets/home-rice-terraces-hq.jpg", f"Unexpected Git-managed asset: {path}"
              with tempfile.NamedTemporaryFile() as tmp, tempfile.NamedTemporaryFile() as hdr:
                  command = ["curl", "--retry", "5", "--retry-all-errors", "--retry-delay", "2", "-fsSL", "--max-time", "35", "-D", hdr.name, "-o", tmp.name, url]
                  subprocess.run(command, check=True)
                  content = open(tmp.name, "rb").read()
                  headers = open(hdr.name, encoding="latin-1").read().lower()
                  mime = {"jpg":"image/jpeg","png":"image/png","webp":"image/webp","avif":"image/avif"}[ext]
                  assert f"content-type: {mime}" in headers, f"Unexpected MIME for {sha}: {headers[-900:]}"
                  assert len(content) > 50_000, f"Image unexpectedly small: {sha}"
                  dims = dimensions(content)
                  assert dims is not None, f"Could not parse image dimensions: {sha}"
                  width, height = dims
                  assert width >= 300 and height >= 200, f"Insufficient or invalid wallpaper dimensions: {sha} {dims}"
                  if path:
                      assert (width, height) == (1280, 854), f'Home image dimensions changed: {(width,height)}'
                  elif width < 1280:
                      print(f"WARNING: {sha[:12]}.{ext} is {width}px wide; wide screens may upscale it")
                  print(f"Verified {url}: {width} x {height}, {len(content):,} bytes; full-width banner crop")
          PY
          invalid="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 https://dofinances.com/wallpapers/not-allowlisted.jpg)"
          test "$invalid" = 404
          rm "$source_js" "$source_css"
          echo 'Git-managed Home and seven library-iii wallpapers are live'

      - name: Verify authentication boundaries and new account security routes
        shell: bash
        run: |
          set -euo pipefail
          base=https://dofinances.com
          check() {
            local method="$1" path="$2" expected="$3"
            local code
            code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' -X "$method" "$base$path")"
            echo "$method $path -> $code (expected $expected)"
            test "$code" = "$expected"
          }
          check GET /app 302
          check GET /api/auth/me 401
          check GET /api/auth/mfa/status 401
          check GET /verify 200
          check GET /reset 200
          configuration="$(curl -fsS --max-time 20 "$base/api/auth/config")"
          [[ "$configuration" == *'"mfaAvailable":true'* ]]
          [[ "$configuration" == *'"emailAvailable":'* ]]
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://evil.example' \
            -d '{}' "$base/api/auth/password/forgot")"
          test "$code" = 403
          code="$(curl -sS --max-time 20 -o /dev/null -w '%{http_code}' \
            -X POST -H 'Content-Type: application/json' -H 'Origin: https://dofinances.com' \
            -d '{"token":"invalid"}' "$base/api/auth/verification/confirm")"
          test "$code" = 400
          echo "Authentication access boundaries verified; sending is tested separately after email provider activation"

      - name: Verify live sidebar cursors, hit target and logo separation in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-sidebar.mjs

      - name: Verify five Glass gallery controls and backgrounds in headless Chrome
        shell: bash
        run: |
          set -euo pipefail
          node scripts/verify-live-gallery.mjs
